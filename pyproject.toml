[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-job-agent"
version = "0.1.0"
description = "Autonomous career intelligence pipeline and dashboard"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.0",
    "playwright>=1.40",
    "openai>=1.0",
    "rapidfuzz>=3.0",
    "streamlit>=1.28",
    "altair>=5.0",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["paths"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["agent*", "db*"]
